<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>try{var T=localStorage.getItem("theme")}catch(e){}document.documentElement.dataset.theme=T||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")</script>
<title>Meteo – prognoza dla miejscowości</title>
<style>
  :root{--bg:#f2f6fb;--card:#fff;--fg:#17212f;--mut:#667085;--grid:#e8edf4;--axis:#8793a6;--line:#cdd6e3;--acc:#1c6ad1;--sh:0 1px 2px #1017280f,0 6px 20px #1017280d}
  :root[data-theme=dark]{--bg:#0d131b;--card:#151d29;--fg:#e8edf4;--mut:#93a0b4;--grid:#232f40;--axis:#7d8a9e;--line:#344256;--acc:#5aa0f0;--sh:0 0 0 1px #ffffff0d}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{background:linear-gradient(135deg,#0d3a75,#1c6ad1);padding:1rem .8rem 1.1rem;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px #0004}
  .in{max-width:1000px;margin:0 auto;position:relative}
  #th{position:absolute;right:0;top:-.1rem;width:2.2rem;height:2.2rem;border:0;border-radius:50%;background:#ffffff26;color:#fff;font-size:1.15rem;cursor:pointer;line-height:1}
  #th:hover{background:#ffffff45}
  h1{margin:0 0 .6rem;font-size:1.15rem;font-weight:650;color:#fff;letter-spacing:.2px}
  input{width:100%;padding:.75rem 1rem;font:inherit;font-size:1.05rem;border:0;border-radius:12px;background:#fff;color:#17212f;outline:0;box-shadow:0 2px 8px #0003}
  input:focus{box-shadow:0 0 0 3px #ffffff80,0 2px 8px #0003}
  #list{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border-radius:12px;max-height:55vh;overflow:auto;box-shadow:0 12px 32px #0006}
  #list div{padding:.6rem 1rem;cursor:pointer;border-bottom:1px solid var(--grid)}
  #list div:last-child{border:0}
  #list div:hover,#list div.on{background:var(--grid)}
  small{color:var(--mut);margin-left:.4rem}
  main{max-width:1000px;margin:0 auto;padding:.8rem}
  #bar{display:flex;flex-wrap:wrap;align-items:baseline;gap:.2rem .8rem;margin:.2rem .2rem .8rem}
  #bar b{font-size:1.35rem}
  #bar span,#bar a{color:var(--mut);font-size:.9rem}
  #bar a{color:var(--acc);text-decoration:none}
  #bar a:hover{text-decoration:underline}
  .chart{position:relative;background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:.8rem .9rem .4rem;margin-bottom:.8rem}
  .ct{font-weight:650;display:flex;flex-wrap:wrap;gap:.1rem .9rem;align-items:baseline}
  .ct small{font-weight:400;margin:0}
  .ct span{font-weight:400;color:var(--mut);font-size:.85rem;white-space:nowrap}
  .ct i{display:inline-block;width:.8em;height:.5em;margin-right:.35em;border-radius:3px;vertical-align:.05em}
  svg{display:block;touch-action:pan-y;overflow:visible}
  .t{fill:var(--axis);font-size:11px}
  .gl{stroke:var(--grid)}
  .dv{stroke:var(--line)}
  .now{stroke:var(--acc);stroke-dasharray:3 3}
  .cur{stroke:var(--fg);stroke-opacity:.35}
  .mk{fill:var(--fg);font-size:11px;font-weight:650;paint-order:stroke;stroke:var(--card);stroke-width:3px}
  .tip{position:absolute;pointer-events:none;background:var(--card);color:var(--fg);border-radius:8px;padding:.4rem .6rem;font-size:.8rem;box-shadow:0 4px 18px #0004,0 0 0 1px var(--line);white-space:nowrap;z-index:3}
  .tip b{display:block;margin-bottom:.15rem}
  .tip i{display:inline-block;width:.7em;height:.7em;border-radius:50%;margin-right:.4em}
  .msg{padding:1.2rem .4rem;color:var(--mut);text-align:center}
  .foot{color:var(--mut);font-size:.8rem;text-align:center;padding:.4rem 0 1rem}
</style>
</head>
<body>
<header><div class="in">
  <h1>Meteo · prognoza godzinowa</h1>
  <button id="th" title="Zmień motyw (jasny/ciemny)" aria-label="Zmień motyw"></button>
  <input id="q" placeholder="Wpisz nazwę miejscowości…" autocomplete="off" autofocus>
  <div id="list" hidden></div>
</div></header>
<main>
  <div id="bar"></div>
  <div id="charts"><div class="msg">Wpisz nazwę miejscowości, aby zobaczyć prognozę.</div></div>
</main>
<script>
const $=id=>document.getElementById(id),q=$('q'),list=$('list'),bar=$('bar'),chartsEl=$('charts');
const th=$('th'),root=document.documentElement;
const setIcon=()=>{th.textContent=root.dataset.theme==='dark'?'☀':'☾'};setIcon();
th.onclick=()=>{const n=root.dataset.theme==='dark'?'light':'dark';root.dataset.theme=n;try{localStorage.setItem('theme',n)}catch(e){}setIcon()};
let cities=[],hits=[],sel=-1;
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ł/g,'l');
fetch('cities.min.json').then(r=>r.json()).then(d=>{cities=d.map(c=>({n:c[0],lat:c[1],lon:c[2],k:norm(c[0])}));fromHash()});
const url=c=>`https://app.meteo.pl/meteogram/${c.lat},${c.lon}`;
function show(c){
  q.value=c.n;list.hidden=true;q.blur();
  bar.innerHTML=`<b>${c.n}</b><span>${c.lat}, ${c.lon}</span><a href="${url(c)}" target="_blank" rel="noopener">oryginalny meteogram ↗</a>`;
  document.title=`${c.n} – Meteo`;location.hash=`${c.lat},${c.lon}`;
  loadCharts(c);
}
function render(){
  list.innerHTML='';
  hits.forEach((c,i)=>{const d=document.createElement('div');if(i===sel)d.className='on';
    d.innerHTML=`${c.n}<small>${c.lat}, ${c.lon}</small>`;d.onclick=()=>show(c);list.appendChild(d)});
  list.hidden=!hits.length;
}
q.oninput=()=>{
  const t=norm(q.value.trim());sel=-1;
  if(!t){hits=[];return render()}
  const starts=[],cont=[];
  for(const c of cities){if(c.k.startsWith(t))starts.push(c);else if(c.k.includes(t))cont.push(c);if(starts.length>=30)break}
  hits=starts.concat(cont).slice(0,30);render();
};
q.onkeydown=e=>{
  if(e.key==='ArrowDown'){sel=Math.min(sel+1,hits.length-1);render();e.preventDefault()}
  else if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);render();e.preventDefault()}
  else if(e.key==='Enter'&&hits.length)show(hits[Math.max(sel,0)]);
  else if(e.key==='Escape'){list.hidden=true}
};
document.addEventListener('click',e=>{if(!e.target.closest('header'))list.hidden=true});
function fromHash(){
  const m=location.hash.match(/^#(-?[\d.]+),(-?[\d.]+)$/);if(!m)return;
  const c=cities.find(x=>x.lat==m[1]&&x.lon==m[2]);if(c)show(c);
}

/* Wykresy: dane z wewnętrznego API app.meteo.pl (model UM 4 km, ~60 h), rysowane jako SVG. */
const API='https://devmgramapi.meteo.pl';
let reqId=0,last=null,lastW=0;
async function loadCharts(c){
  const id=++reqId;chartsEl.innerHTML='<div class="msg">Ładowanie prognozy…</div>';
  try{
    const av=await (await fetch(API+'/meteorograms/available')).json();
    const run=av.um4_60[av.um4_60.length-1];
    const r=await fetch(API+'/meteorograms/um4_60',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({point:{lat:String(c.lat),lon:String(c.lon)},date:run})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=(await r.json()).data;if(id!==reqId)return;
    last=d;drawAll(d);
  }catch(e){if(id===reqId){last=null;chartsEl.innerHTML=`<div class="msg">Nie udało się pobrać danych (${e.message}).</div>`}}
}
addEventListener('resize',()=>{clearTimeout(drawAll.t);drawAll.t=setTimeout(()=>{if(last&&chartsEl.clientWidth!==lastW)drawAll(last)},150)});
const arr=(d,k,f=1)=>d[k].data.map(v=>v*f);
function drawAll(d){
  const base=d.airtmp_point,o={t0:+base.first_timestamp,dt:base.interval,n:base.data.length};
  const gmax=arr(d,'grdtmp_max'),gmin=arr(d,'grdtmp_min'),gmid=gmax.map((v,i)=>(v+gmin[i])/2);
  chartsEl.innerHTML='';lastW=chartsEl.clientWidth;
  chart({...o,title:'Temperatura',unit:'°C',layers:[
    {type:'band',lo:arr(d,'airtmp_min'),hi:arr(d,'airtmp_max'),color:'#e5484d'},
    {type:'band',lo:gmin,hi:gmax,color:'#b9803f'},
    {type:'line',data:gmid,color:'#b9803f',label:'grunt',u:'°C',dash:'5 3'},
    {type:'line',data:arr(d,'airtmp_point'),color:'#e5484d',label:'powietrze 2 m',u:'°C',marks:1}]});
  chart({...o,title:'Opad i wilgotność',unit:'mm/h',unitR:'%',loR:0,hiR:100,lo:0,minHi:1,layers:[
    {type:'bars',data:arr(d,'pcpttl_aver'),color:'#2f7de1',label:'opad',u:'mm/h'},
    {type:'line',axis:'R',data:arr(d,'realhum_aver'),color:'#2a9d8f',label:'wilgotność',u:'%'}]});
  chart({...o,title:'Wiatr',unit:'m/s',lo:0,minHi:5,layers:[
    {type:'line',data:arr(d,'wind_gust_max'),color:'#e08a00',label:'porywy',u:'m/s',dash:'5 3'},
    {type:'line',data:arr(d,'wind10_sd_true_prev_point'),color:'#2f7de1',label:'wiatr 10 m',u:'m/s',marks:1}]});
  chart({...o,title:'Zachmurzenie i mgła',unit:'%',lo:0,hi:100,layers:[
    {type:'area',data:arr(d,'cldtot_aver',100),color:'#7a869a',label:'zachmurzenie całk.',u:'%'},
    {type:'line',data:arr(d,'fog_max',100),color:'#a05bc4',label:'mgła',u:'%'}]});
  chart({...o,title:'Chmury wg wysokości',unit:'%',lo:0,hi:100,layers:[
    {type:'area',data:arr(d,'cldhigh_aver',100),color:'#b58be0',label:'wysokie (Ci, Cs)',u:'%'},
    {type:'area',data:arr(d,'cldmed_aver',100),color:'#2f9bd6',label:'średnie (Ac, As)',u:'%'},
    {type:'area',data:arr(d,'cldlow_aver',100),color:'#5b6b86',label:'niskie (St, Sc, Cu)',u:'%'}]});
  chartsEl.insertAdjacentHTML('beforeend',`<div class="foot">Model UM 4 km, bieg ${base.fstart} · czas: Europe/Warsaw</div>`);
}
const nice=r=>{const m=Math.pow(10,Math.floor(Math.log10(r))),f=r/m;return(f<=1?1:f<=2?2:f<=5?5:10)*m};
function axis(vals,fLo,fHi,minHi){
  let lo=fLo??Math.min(...vals)-.5,hi=fHi??Math.max(...vals)+.5;
  if(minHi!=null)hi=Math.max(hi,minHi);
  const step=nice((hi-lo)/5||1);
  if(fLo==null)lo=Math.floor(lo/step)*step;if(fHi==null)hi=Math.ceil(hi/step)*step;
  return{lo,hi,step};
}
const TZ='Europe/Warsaw',dtf=o=>new Intl.DateTimeFormat('pl-PL',{timeZone:TZ,...o}),
  fH=dtf({hour:'numeric',hourCycle:'h23'}),fD=dtf({weekday:'short',day:'numeric',month:'numeric'}),fT=dtf({weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function chart(s){
  const {t0,dt,n,layers}=s,hasR=layers.some(l=>l.axis==='R');
  const div=document.createElement('div');div.className='chart';chartsEl.appendChild(div);
  const W=Math.max(280,div.clientWidth-28),H=190,L=34,R=hasR?34:8,T=8,B=30,pw=W-L-R,ph=H-T-B,narrow=W<520;
  const vals=ax=>layers.filter(l=>(l.axis||'L')===ax).flatMap(l=>l.type==='band'?l.lo.concat(l.hi):l.data);
  const A=axis(vals('L'),s.lo,s.hi,s.minHi),AR=hasR?axis(vals('R'),s.loR,s.hiR):null;
  const X=i=>L+pw*i/(n-1),Y=(v,a=A)=>T+ph*(1-(v-a.lo)/(a.hi-a.lo)),lab=v=>+v.toFixed(2);
  let g='';
  for(let v=A.lo;v<=A.hi+1e-9;v+=A.step)
    g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"${v===0&&s.unit==='°C'?' style="stroke:#4a90d9"':''}/><text class="t" x="${L-6}" y="${Y(v)+4}" text-anchor="end">${lab(v)}</text>`;
  if(hasR)for(let v=AR.lo;v<=AR.hi+1e-9;v+=AR.step)
    g+=`<text class="t" x="${W-R+6}" y="${Y(v,AR)+4}" style="fill:#2a9d8f">${lab(v)}</text>`;
  for(let i=0;i<n;i++){const ts=t0+i*dt,d=new Date(ts*1000),h=+fH.format(d);
    if(h===0)g+=`<line class="dv" x1="${X(i)}" x2="${X(i)}" y1="${T}" y2="${T+ph}"/><text class="t" x="${X(i)+(X(i)>W-80?-4:4)}" y="${H-16}" text-anchor="${X(i)>W-80?'end':'start'}" style="font-weight:600">${fD.format(d)}</text>`;
    else if(h%(narrow?12:6)===0)g+=`<text class="t" x="${X(i)}" y="${H-3}" text-anchor="middle">${h}:00</text>`}
  const nowI=(Date.now()/1000-t0)/dt;
  if(nowI>=0&&nowI<=n-1)g+=`<line class="now" x1="${X(nowI)}" x2="${X(nowI)}" y1="${T}" y2="${T+ph}"/>`;
  const bw=Math.max(2,pw/(n-1)*.7);
  for(const l of layers){
    const ax=l.axis==='R'?AR:A,pt=a=>a.map((v,i)=>`${X(i).toFixed(1)},${Y(v,ax).toFixed(1)}`),y0=Y(ax.lo,ax);
    if(l.type==='band')g+=`<polygon points="${pt(l.hi).concat(pt(l.lo).reverse()).join(' ')}" fill="${l.color}" fill-opacity=".16"/>`;
    else if(l.type==='area')g+=`<polygon points="${[`${X(0)},${y0}`].concat(pt(l.data),[`${X(n-1)},${y0}`]).join(' ')}" fill="${l.color}" fill-opacity="${l.fo||.22}" stroke="${l.color}" stroke-width="1.5" stroke-linejoin="round"/>`;
    else if(l.type==='bars')l.data.forEach((v,i)=>{if(v>=.03)g+=`<rect x="${(X(i)-bw/2).toFixed(1)}" y="${Y(v,ax).toFixed(1)}" width="${bw.toFixed(1)}" height="${(y0-Y(v,ax)).toFixed(1)}" rx="1.5" fill="${l.color}"/>`});
    else{g+=`<polyline points="${pt(l.data).join(' ')}" fill="none" stroke="${l.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"${l.dash?` stroke-dasharray="${l.dash}"`:''}/>`;
      if(l.marks)for(const[i,dy]of[[l.data.indexOf(Math.max(...l.data)),-7],[l.data.indexOf(Math.min(...l.data)),15]])
        g+=`<circle cx="${X(i)}" cy="${Y(l.data[i],ax)}" r="3" fill="${l.color}"/><text class="mk" x="${X(i)}" y="${Y(l.data[i],ax)+dy}" text-anchor="middle">${l.data[i].toFixed(1)}</text>`}
  }
  const leg=layers.filter(l=>l.label).map(l=>`<span><i style="background:${l.color}"></i>${l.label}</span>`).join('');
  div.innerHTML=`<div class="ct">${s.title}<small>${s.unit}${s.unitR?' · '+s.unitR:''}</small>${leg}</div><svg width="${W}" height="${H}">${g}<line class="cur" y1="${T}" y2="${T+ph}" style="display:none"/></svg><div class="tip" hidden></div>`;
  const svg=div.querySelector('svg'),cur=svg.lastChild,tip=div.querySelector('.tip'),top=div.querySelector('.ct').offsetHeight+14;
  svg.onpointermove=e=>{
    const i=Math.max(0,Math.min(n-1,Math.round((e.clientX-svg.getBoundingClientRect().left-L)/pw*(n-1))));
    cur.setAttribute('x1',X(i));cur.setAttribute('x2',X(i));cur.style.display='';
    tip.innerHTML=`<b>${fT.format(new Date((t0+i*dt)*1000))}</b>`+layers.filter(l=>l.label).map(l=>`<i style="background:${l.color}"></i>${l.label}: ${l.data[i].toFixed(1)} ${l.u}<br>`).join('');
    tip.hidden=false;const w=tip.offsetWidth,x=X(i)+14+14;
    tip.style.left=(x+w>div.clientWidth-4?X(i)+14-w-10:x)+'px';tip.style.top=top+'px';
  };
  svg.onpointerleave=()=>{cur.style.display='none';tip.hidden=true};
}
</script>
</body>
</html>
